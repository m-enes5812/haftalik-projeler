name: kampus-etkinlik-api

on:
  push:
    branches: [main]
    paths:
      - "2026-11-26-kampus-etkinlik-api/**"
      - ".github/workflows/kampus-etkinlik-api.yml"
  pull_request:
    paths:
      - "2026-11-26-kampus-etkinlik-api/**"
      - ".github/workflows/kampus-etkinlik-api.yml"

permissions:
  contents: read

defaults:
  run:
    working-directory: 2026-11-26-kampus-etkinlik-api

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Derle, biçim kontrolü, birim + entegrasyon testleri
        run: ./mvnw -B verify
      - name: Docker imajı derlenebiliyor mu
        run: docker build -t kampus-etkinlik-api .
      - name: Kapsam raporu
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-raporu
          path: 2026-11-26-kampus-etkinlik-api/target/site/jacoco/
          if-no-files-found: ignore
